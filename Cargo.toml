[workspace]
resolver = "3"
members = ["crates/*"]
# The frozen Tauri shell keeps its own workspace so `cargo tauri build` for the
# old app is unaffected by this one.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/floriankraemer/webglobe"

[workspace.dependencies]
terra-core = { path = "crates/terra-core" }
terra-kml = { path = "crates/terra-kml" }
terra-providers = { path = "crates/terra-providers" }
terra-storage = { path = "crates/terra-storage" }
terra-storage-sqlite = { path = "crates/terra-storage-sqlite" }
terra-storage-indexeddb = { path = "crates/terra-storage-indexeddb" }
terra-storage-remote = { path = "crates/terra-storage-remote" }
terra-globe = { path = "crates/terra-globe" }
terra-app = { path = "crates/terra-app" }
terra-testkit = { path = "crates/terra-testkit" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4", "js"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.92"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# eframe 0.37 pins wgpu 30.0; a hard 30.0.1 breaks its wasm-bindgen-futures pin.
wgpu = "30.0"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ehttp = "0.7.2"
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
directories = "6"
web-time = "1"
url = "2.5"
indexmap = { version = "2.14", features = ["serde"] }
base64 = "0.22"
pollster = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
