[workspace]
resolver = "3"
members = [
    "crates/terra-core",
    "crates/terra-geo",
    "crates/terra-scene",
    "crates/terra-render",
    "crates/terra-platform",
    "crates/terra-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/floriankraemer/Terra-Globe"

[workspace.dependencies]
terra-core = { path = "crates/terra-core" }
terra-geo = { path = "crates/terra-geo" }
terra-scene = { path = "crates/terra-scene" }
terra-render = { path = "crates/terra-render" }
terra-platform = { path = "crates/terra-platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
glam = { version = "0.34", features = ["serde"] }
quick-xml = { version = "0.42", features = ["serialize"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
earcutr = "0.5"
lru = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
egui-wgpu = "0.37"
egui_extras = "0.37"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
resvg = { version = "0.48", default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland", "pollster"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
cast_possible_wrap = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev.package."*"]
opt-level = 2
